# Yalnizca DEGISTIRDIGIMIZ anahtarlar; gerisi Keycloak'in kendi Turkce
# paketinden (base/login/messages/messages_tr.properties) miras alinir.
#
# Dosya UTF-8'dir: Java'nin .properties standardi ISO-8859-1 der ama Keycloak
# tema mesaj paketlerini UTF-8 okur (kutudan cikan messages_tr.properties de
# UTF-8, escape'siz Turkce karakter iceriyor).
#
# DIKKAT: Bu degerler sablonda HTML olarak DEGIL duz metin olarak basilir
# (login.ftl'de ${msg("noAccount")}, ?no_esc yok) - buraya etiket yazilirsa
# ekranda etiketin kendisi gorunur. Bicimli/HTML metin gereken tek yer sayfa
# basligidir; o da realm'in displayNameHtml alanindan gelir.

# Marka adi artik basligin USTUNDE duruyor (realm displayNameHtml -> .ga-marka),
# bu yuzden baslikta tekrarlanmiyor.
# Not: tek tirnak MessageFormat'ta escape karakteridir ve degeri yer
# ("GreenAsset'e" -> "GreenAssete"); gerekirse '' yazilmali.
loginAccountTitle=Tekrar hoş geldiniz

# Formun altindaki serit: "<noAccount> <doRegister baglantisi>"
# Personelin buradan kayit olmasi ANLAMSIZ (kendi kaydolan herkes `vatandas`
# rolu alir, personel hesabini yonetici acar), bu yuzden cumle dogrudan
# vatandasa hitap ediyor.
noAccount=Vatandaşsanız ve henüz hesabınız yoksa
doRegister=hemen kayıt olun

registerTitle=Vatandaş hesabı oluşturun
emailForgotTitle=Parolanızı mı unuttunuz?

# Dil secici: her dil KENDI dilinde yazilir. Keycloak varsayilan olarak
# etiketi o anki arayuz diline cevirir ("İngilizce (English)"), yani liste
# okuyanin bilmedigi bir dilde olabiliyor. Kendi adiyla yazmak, dili
# secebilecek kisinin onu taniyacagi tek bicimdir.
locale_tr=Türkçe
locale_en=English
