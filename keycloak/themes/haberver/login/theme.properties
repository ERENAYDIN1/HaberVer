# haber ver giris temasi.
#
# Keycloak artik kullanicinin gordugu TEK giris ekrani (uygulama kendi parola
# formunu tutmuyor, korumali bir rotaya girilince dogrudan buraya yonlendirir),
# bu yuzden ekranin dili ve gorunumu uygulamanin devami gibi olmali.
#
# parent=keycloak.v2: 26.x ile gelen PatternFly 5 tabanli yeni giris temasi.
# Eski `keycloak` temasi PatternFly 3/4 karisimi ve gorunur sekilde eskimis.
parent=keycloak.v2
import=common/keycloak

# `styles` ust temayi EZER, miras almaz: parent'in css/styles.css'i burada
# tekrar sayilmazsa PatternFly duzeni tamamen kaybolur.
styles=css/styles.css css/haberver.css

locales=tr,en
