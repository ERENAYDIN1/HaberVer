# Proje adi ACIKCA yazilir: verilmezse Compose onu DIZIN adindan turetir
# (`HaberVer` -> `haberver`, eskiden `GreenAsset` -> `greenasset`) ve volume'ler
# o onekle olusurdu. Burada sabitlendigi icin dizin adi ne olursa olsun
# volume'ler `haberver_*` kalir -- klasoru yeniden adlandirmak veriyi terk ettirmez.
name: haberver

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: haberver_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kimlik saglayici. Kullanici/parola/rol burada yasar; uygulama yalnizca
  # dogrulanmis kimligi ogrenir (bkz. backend/app/keycloak.py).
  #   - `start-dev`: gomulu H2 veritabani + HTTP (yalnizca gelistirme icindir).
  #   - `--import-realm`: keycloak/realm-haberver.json yalnizca ILK acilista
  #     (realm henuz yokken) alinir; sonraki degisiklikler konsoldan yapilir.
  #   - KC_HOSTNAME tarayicinin gordugu adrestir ve token'daki `iss` degerini
  #     belirler; backend Keycloak'a ag icinden (keycloak:8080) gider ama
  #     token'i bu ISSUER'a gore dogrular (bkz. KEYCLOAK_PUBLIC_URL/INTERNAL_URL).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: haberver_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      # Giris temasi AYRI bir mount ister: import dizini yalnizca realm JSON'u
      # icin taranir, temalar oradan okunmaz. `start-dev` tema onbellegini
      # kapatir, yani CSS/mesaj degisikligi icin sayfayi yenilemek yeter
      # (production `start` modunda onbellek acilir).
      - ./keycloak/themes:/opt/keycloak/themes:ro
      - kcdata:/opt/keycloak/data

  backend:
    build: ./backend
    container_name: haberver_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      APP_BASE_URL: ${APP_BASE_URL}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
      # Ilk admin hesabi. Bunlar UNUTULMUSTU: konteynere gecirilmedikleri ve
      # `.env` repo kokunde durup /app'e mount edilmedigi icin (yalnizca
      # ./backend mount'lu) pydantic-settings dosyayi hic bulamiyor, dolayisiyla
      # scripts/keycloak_bootstrap.py ilk admini `.env` ne yazarsa yazsin kodda
      # yazili varsayilanla aciyordu. Varsayilanlar artik kaldirildi (config.py),
      # yani bu iki satirin eksik olmasi sessiz bir zayiflik degil acilista hata.
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - ./backend:/app
      # Ihbar fotograflari proje dizinine degil, Docker'in kendi volume'une yazilsin.
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: haberver_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      # Vite dev sunucusu /api ve /media'yi backend'e proxy'ler; boylece
      # tarayici icin her sey tek origin'dedir (oturum cookie'sinin sarti).
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./frontend:/app
      # Container'in kendi (Linux) node_modules'i host'unkiyle (Windows) ezilmesin.
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  media:
  kcdata:
