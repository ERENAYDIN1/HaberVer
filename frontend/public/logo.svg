<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none" role="img" aria-label="GreenAsset">
  <defs>
    <linearGradient id="ga-halka" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc242"/>
      <stop offset="1" stop-color="#1c7d3f"/>
    </linearGradient>
    <linearGradient id="ga-bina" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#66bd4a"/>
      <stop offset="1" stop-color="#2f8f43"/>
